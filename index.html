<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kenya Import Duty Calculator 2025</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      body { font-family: Arial, sans-serif; background:#f7f9fc; margin:0; padding:20px; }
      .container { max-width: 760px; margin:0 auto; background:#fff; padding:24px; border-radius:12px; box-shadow:0 4px 16px rgba(0,0,0,.08); }
      h1 { font-size: 1.4rem; margin-top: 0; }
      label { display:block; margin-top:12px; font-weight:600; }
      input, select { width:100%; padding:10px; border:1px solid #ccc; border-radius:6px; margin-top:6px; box-sizing:border-box; }
      .error { color:#c0392b; margin-top:6px; }
      .result { margin-top:24px; border:1px solid #e0e0e0; border-radius:8px; padding:16px; }
      table td { padding:8px 0; border-bottom:1px solid #f0f0f0; }
      table tr:last-child td { border-bottom:none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel" src="./app.js"></script>
  </body>
</html>
